name: Build and release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      stable:
        type: boolean
        description: Stable release ?
        default: false
      version-bump:
        type: choice
        description: Version level
        required: false
        options: [major, minor, patch]
        default: patch
      reset-cache:
        type: boolean
        default: false
        description: Delete cache ?
      skip-build:
        type: boolean
        default: false
        description: Skip APK build ?
      is-draft:
        type: boolean
        description: Draft release ?
        default: false
      description:
        required: false
        description: Release description

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  check-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Exit if stable without description
        if: ${{ inputs.stable && !inputs.description }}
        run: |
          echo "❌ Missing description for a stable release"
          exit 1

  build:
    runs-on: ubuntu-latest
    needs: [check-inputs]
    outputs:
      next-version: ${{ steps.final-version.outputs.value }}
      build-name: ${{ steps.build-name.outputs.value }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: npm

      - name: Clear npm cache
        if: ${{ inputs.reset-cache }}
        run: npm cache clean --force

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # -------------------------
      # Versioning
      # -------------------------
      - name: Get latest release tag
        id: get-latest-tag
        uses: pozetroninc/github-action-get-latest-release@master
        with:
          repository: ${{ github.repository }}
          excludes: prerelease

      - name: Calculate next stable version
        id: version_build
        if: ${{ inputs.stable }}
        uses: reecetech/version-increment@2024.10.1
        with:
          scheme: semver
          increment: ${{ inputs.version-bump }}
          tag_prefix: v

      - name: Finalize Version String
        id: final-version
        run: |
          if [ "${{ inputs.stable }}" = "true" ]; then
            echo "value=${{ steps.version_build.outputs.v-version }}" >> "$GITHUB_OUTPUT"
          else
            HASH=$(git rev-parse --short HEAD)
            BASE="${{ steps.get-latest-tag.outputs.release || 'v0.0.0' }}"
            echo "value=$BASE-$HASH" >> "$GITHUB_OUTPUT"
          fi

      # -------------------------
      # Update Files
      # -------------------------
      - name: Update package.json & app.config.ts
        run: |
          VERSION="${{ steps.final-version.outputs.value }}"
          CLEAN_VERSION="${VERSION#v}"
          node -e "const fs = require('fs'); const pkg = require('./package.json'); pkg.version = '$CLEAN_VERSION'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));"
          sed -i "s/{{VERSION}}/$VERSION/g" app.config.ts

      - run: npm install

      # -------------------------
      # Android Build
      # -------------------------
      - name: Increment Android Version Code
        id: android-version
        if: ${{ !inputs.skip-build }}
        run: |
          CURRENT_VCODE=$(eas app:inspect --platform android --non-interactive 2>/dev/null | grep versionCode | awk '{print $2}' | tr -d '",')
          echo "value=$((${CURRENT_VCODE:-0} + 1))" >> "$GITHUB_OUTPUT"

      - name: Build APK
        if: ${{ !inputs.skip-build }}
        env:
          ANDROID_VERSION_CODE: ${{ steps.android-version.outputs.value }}
        run: eas build --platform android --profile preview --local --non-interactive

      - name: Rename and Hash APK
        id: build-name
        if: ${{ !inputs.skip-build }}
        run: |
          VERSION="${{ steps.final-version.outputs.value }}"
          if [ "${{ inputs.stable }}" = "true" ]; then
            NAME="MarioKalc_${VERSION}.apk"
          else
            NAME="MarioKalc-nightly_${VERSION}.apk"
          fi
          mv build-*.apk "$NAME"
          sha256sum "$NAME" > sha256sum-android.txt
          echo "value=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload Artifacts
        if: ${{ !inputs.skip-build }}
        uses: actions/upload-artifact@v4
        with:
          name: build-assets
          path: |
            *.apk
            sha256sum-android.txt
            package.json
            package-lock.json

  release:
    needs: [build]
    if: ${{ !inputs.skip-build }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Build Assets
        uses: actions/download-artifact@v4
        with:
          name: build-assets
          path: ./release-files

      # Commit seulement si stable
      - name: Commit version bump
        if: ${{ inputs.stable }}
        run: |
          cp ./release-files/package*.json .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ needs.build.outputs.next-version }}" || echo "No changes"
          git push origin HEAD:${{ github.ref_name }}

      - name: Generate changelog
        id: changelog
        run: |
          # On cherche le dernier tag stable pour comparer
          LAST_TAG=$(git tag -l --sort=-version:refname | grep -v '-' | head -n 1)
          EOF=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64)
          echo "content<<$EOF" >> "$GITHUB_OUTPUT"
          if [ -z "$LAST_TAG" ]; then
            git log --pretty=format:'- %s (%h)' --max-count=20 >> "$GITHUB_OUTPUT"
          else
            git log ${LAST_TAG}..HEAD --pretty=format:'- %s (%h)' >> "$GITHUB_OUTPUT"
          fi
          echo "" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Publish Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ github.token }}
          tag: ${{ inputs.stable && needs.build.outputs.next-version || format('nightly-{0}', needs.build.outputs.next-version) }}
          name: ${{ inputs.stable && format('Mario Kalc {0}', needs.build.outputs.next-version) || format('Nightly {0}', needs.build.outputs.next-version) }}
          prerelease: ${{ !inputs.stable }}
          draft: ${{ inputs.is-draft }}
          body: |
            ${{ inputs.description }}

            ${{ inputs.stable && '## 🔧 Changelog' || '## 🧪 Changes in this nightly' }}
            ${{ steps.changelog.outputs.content }}

            ${{ !inputs.stable && '⚠️ Unstable build – use at your own risk' || '' }}
          artifacts: "release-files/*.apk,release-files/sha256sum-android.txt"
